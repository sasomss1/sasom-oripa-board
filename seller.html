<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SASOM Oripa Board - Seller Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1B1B1B;
    --accent:#C9FF00;
    --gray-bg:#F2F2F2;
    --gray-line:#E7E7E7;
    --sub:#8A8A8A;
  }
  *{box-sizing:border-box;}
  button{-webkit-appearance:none; appearance:none; color:inherit; font-family:inherit;}
  body{margin:0; font-family:'Inter','Noto Sans Thai',sans-serif; color:var(--dark); background:#F7F7F7; padding:24px; display:flex; justify-content:center;}
  .modal{width:100%; max-width:760px; background:#fff; border-radius:20px; padding:32px 36px 36px; box-shadow:0 10px 40px rgba(0,0,0,.08);}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:20px;}
  .modal-head h1{font-size:22px; font-weight:600; margin:0;}
  .toggle-pill{display:flex; background:var(--gray-bg); border-radius:999px; padding:3px; gap:2px; font-weight:500; font-size:13px; cursor:pointer; user-select:none; flex-shrink:0;}
  .toggle-pill .opt{padding:7px 16px; border-radius:999px; color:var(--sub); transition:.15s;}
  .toggle-pill .opt.active{background:var(--dark); color:#fff;}

  [data-en]{display:none;}
  html[data-lang="en"] [data-en]{display:revert;}
  html[data-lang="en"] [data-th]{display:none;}

  .gate-card{border:1px solid var(--gray-line); border-radius:16px; padding:28px;}
  .gate-card h2{font-size:17px; font-weight:600; margin:0 0 4px;}
  .gate-card .desc{font-size:13px; color:var(--sub); margin:0 0 22px;}
  label{display:block; font-size:13.5px; font-weight:500; margin-bottom:8px;}
  .field{margin-bottom:18px;}
  input:not([type="checkbox"]){width:100%; border:1px solid var(--gray-line); background:var(--gray-bg); border-radius:10px; padding:13px 16px; font-size:14px; color:var(--dark); font-family:inherit;}
  input[type="checkbox"]{appearance:auto; width:18px; height:18px; accent-color:var(--dark); flex-shrink:0; cursor:pointer;}
  .file-row{display:flex; align-items:center; gap:10px; border:1px dashed var(--gray-line); background:var(--gray-bg); border-radius:10px; padding:14px 16px; cursor:pointer;}
  .file-row input[type=file]{display:none;}
  .file-status{font-size:12.5px; color:var(--sub); margin-top:6px;}
  .btn-confirm{background:var(--dark); color:#fff; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:500; cursor:pointer; text-align:center; width:100%;}
  .export-dropdown{position:relative; display:inline-block;}
  .export-menu{position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid var(--gray-line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.14); min-width:150px; z-index:30; display:none; overflow:hidden;}
  .export-menu.open{display:block;}
  .export-menu-item{padding:10px 14px; font-size:13px; cursor:pointer; white-space:nowrap; color:var(--dark); text-align:left;}
  .export-menu-item:hover{background:var(--gray-bg);}
  .btn-confirm.disabled{opacity:.4; cursor:not-allowed;}
  .error-box{background:#FBEAEA; border:1px solid #E9B9B9; color:#C0392B; border-radius:10px; padding:12px 14px; font-size:13px; margin-top:14px; display:none;}

  .seller-pill{background:var(--gray-bg); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin:0 8px 8px 0;}
  .seller-pill.active{background:var(--dark); color:#fff;}
  .seller-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}

  .status-badge{font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; display:inline-block;}
  .status-badge.prepare{background:#FFF6DC; color:#6B5900;}
  .status-badge.on{background:#EAF7EA; color:#2E7D32;}
  .status-badge.off{background:#FBEAEA; color:#C0392B;}

  .back-link{font-size:13.5px; font-weight:500; color:var(--sub); cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;}
  .top-row{display:flex; gap:12px; margin:18px 0 14px;}
  .top-box{flex:1; background:#fff; border:1px solid var(--gray-line); border-radius:14px; padding:14px 16px; font-size:13px; color:var(--sub);}
  .top-box b{display:block; color:var(--dark); font-size:16px; margin-top:2px; font-weight:500;}
  .summary{background:var(--dark); border-radius:16px; padding:18px 20px; margin:0 0 20px;}
  .summary-top{display:flex; justify-content:space-between; align-items:center;}
  .summary-top .summary-label{color:#fff; font-size:14px;}
  .summary-top .summary-value{color:var(--accent); font-weight:600; font-size:22px;}
  .summary-counts{display:flex; gap:12px; margin-top:14px;}
  .count-box{flex:1; background:#fff; border-radius:12px; padding:12px 16px;}
  .count-box .label{font-size:12.5px; color:var(--sub); font-weight:400;}
  .count-box .value{font-size:22px; font-weight:600; margin-top:2px;}

  .item-list{display:flex; flex-direction:column; gap:10px;}
  .item{background:#fff; border:1px solid var(--gray-line); border-radius:14px; padding:12px 14px;}
  .item-top{display:flex; align-items:flex-start; gap:10px;}
  .item-top img{width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--gray-bg);}
  .item-badge{background:var(--dark); color:#fff; font-size:11px; font-weight:500; padding:3px 9px; border-radius:7px; flex-shrink:0;}
  .item-badges{display:flex; flex-wrap:wrap; gap:4px; flex-shrink:0; max-width:160px;}
  .item-info{flex:1; min-width:0;}
  .item-name{font-size:13.5px; font-weight:600;}
  .item-sub{font-size:11.5px; color:var(--sub);}
  .item-price{font-size:13px; font-weight:600;}

  .card{border:1px solid var(--gray-line); border-radius:16px; padding:22px 24px; margin-top:20px;}
  .card h2{font-size:16px; font-weight:600; margin:0 0 14px;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .stat-card{background:var(--gray-bg); border-radius:12px; padding:14px 14px;}
  .stat-card .l{font-size:11.5px; color:var(--sub); font-weight:400; margin-bottom:4px; line-height:1.3;}
  .stat-card .v{font-size:17px; font-weight:600;}
  .stat-card.accent{background:var(--dark);}
  .stat-card.accent .l{color:#C9C9C9;}
  .stat-card.accent .v{color:var(--accent);}
  .live-session{border:1px solid var(--gray-line); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
  .live-session-date{font-weight:600; font-size:14px;}
  .live-session-meta{font-size:12px; color:var(--sub); margin-top:2px;}
  .live-session-top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .live-pay-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--gray-line);}
  .lp-box{background:var(--gray-bg); border-radius:10px; padding:10px 12px; min-width:0;}
  .lp-box.accent{background:var(--dark);}
  .lp-label{font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lp-box.accent .lp-label{color:#C9C9C9;}
  .lp-value{font-size:14px; font-weight:600; color:var(--dark); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lp-box.accent .lp-value{color:var(--accent);}
  .sold-item-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px solid var(--gray-line);}
  .sold-item-row:first-child{border-top:none;}

  .board-row{border:1px solid var(--gray-line); border-radius:14px; padding:16px 20px; margin-bottom:10px; display:flex; align-items:center; gap:16px; cursor:pointer;}
  .board-row-main{flex:1; min-width:0;}
  .board-row-title{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; flex-wrap:wrap;}
  .board-row-sub{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .board-row-stats{display:flex; gap:20px; font-size:12.5px; color:var(--sub); flex-shrink:0;}
  .board-row-stats b{display:block; color:var(--dark); font-size:14px; font-weight:600;}
  .board-row-actions{flex-shrink:0;}
  .board-select-chk{flex-shrink:0;}

  /* ===== Mobile (iPhone etc.) — additive only, desktop styles above untouched ===== */
  @media (max-width: 640px){
    body{ padding:10px; }
    .modal{ padding:22px 16px; border-radius:16px; max-width:100%; }
    .card{ padding:18px 16px; }
    .modal-head{ flex-wrap:wrap; gap:12px; }
    .modal-head h1{ font-size:19px; }
    .top-row{ flex-direction:column; }
    .summary-counts{ flex-direction:column; }
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .live-pay-grid{ grid-template-columns:1fr; }
    .item-top{ flex-wrap:wrap; }
    .item-badges{ max-width:100%; }
    .live-session-top-row{ flex-wrap:wrap; gap:6px; }
    .board-row{ flex-direction:column; align-items:flex-start; }
    .board-row-stats{ flex-wrap:wrap; row-gap:10px; width:100%; }
  }
</style>
</head>
<body>

<div class="modal">
  <div class="modal-head">
    <h1><span data-th>Seller Portal Oripa Board</span><span data-en>Seller Portal Oripa Board</span></h1>
    <div class="toggle-pill" onclick="setLang(document.documentElement.getAttribute('data-lang')==='th'?'en':'th')">
      <div class="opt th">TH</div>
      <div class="opt en active">EN</div>
    </div>
  </div>

  <!-- GATE VIEW -->
  <div id="gateView">
    <div class="gate-card">
      <h2><span data-th>เข้าดูบอร์ดของคุณ</span><span data-en>View your boards</span></h2>

      <div class="field">
        <label><span data-th>Your SASOM email</span><span data-en>Your SASOM email</span></label>
        <input type="text" id="emailInput" placeholder="sasomseller@email.com">
      </div>

      <div class="btn-confirm" onclick="tryEnter()"><span data-th>เข้าดูบอร์ดของฉัน</span><span data-en>View my boards</span></div>
      <div class="error-box" id="gateError"></div>
    </div>
  </div>

  <!-- BOARD LIST + DETAIL VIEW -->
  <div id="boardsView" style="display:none;">

    <!-- LIST SUB-VIEW (default after login) -->
    <div id="boardsListSubView">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <div class="back-link" onclick="backToGate()"><span data-th>ออกจากระบบ / เปลี่ยนอีเมล</span><span data-en>Log out / switch email</span></div>
        <button class="btn-confirm" style="width:auto; padding:9px 16px; font-size:13px;" onclick="exportSelectedBoards()"><span data-th>ส่งออก</span><span data-en>Export</span></button>
      </div>

      <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
        <input type="checkbox" id="selectAllBoards" onchange="toggleSelectAllBoards(this.checked)">
        <label for="selectAllBoards" style="font-size:13px; color:var(--sub); cursor:pointer;"><span data-th>เลือกทั้งหมด</span><span data-en>Select all</span></label>
        <span id="selectedCountLabel" style="font-size:12.5px; color:var(--sub);"></span>
      </div>

      <div id="sellerBoardsListWrap"></div>
    </div>

    <!-- DETAIL SUB-VIEW (shown after clicking a board) -->
    <div id="boardDetailSubView" style="display:none;">
      <div class="back-link" onclick="showBoardsList()">← <span data-th>บอร์ดทั้งหมด</span><span data-en>All Boards</span></div>
      <div id="boardDetail"></div>
    </div>

  </div>
</div>

<script>
// Paste the same Apps Script Web App URL used in admin.html (see apps-script-backend.gs)
var API_URL = 'https://script.google.com/macros/s/AKfycbwUZdHBcNITE9ds3nQsendjXfN7hTd6XFamolIDXhKFZRI4xINBnxbUHSTMr1FF60jb/exec';

var myBoards = [];
var currentBoardIdx = 0;

function fmt(n){ return '฿' + Math.round(n).toLocaleString('en-US'); }
function fmtPrice(n){ return n ? fmt(n) : '—'; }
function formatDateDMY(iso){
  if(!iso) return '—';
  var parts = iso.split('-');
  if(parts.length !== 3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function apiConfigured(){ return API_URL && API_URL.indexOf('http') === 0; }
function padSlot(n){ return 'S-'+String(n).padStart(3,'0'); }

// ============== CSV EXPORT ==============
function csvEscape(val){
  var s = (val === null || val === undefined) ? '' : String(val);
  if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCSV(rows){
  return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
}
function downloadCSV(filename, rows){
  var csv = rowsToCSV(rows);
  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function boardToCSVBlock(b){
  var rows = [];
  rows.push(['Board Name', b.boardName]);
  rows.push(['Seller Email', b.sellerEmail]);
  rows.push(['Status', b.status || 'PREPARE']);
  rows.push(['Price / Spot', b.stats.pricePerSpot]);
  rows.push(['Total Spots', b.stats.totalSlots]);
  rows.push(['Max Money', b.stats.maxMoney]);
  rows.push([]);

  rows.push(['Slot', 'Type', 'Product Name', 'SKU', 'Condition', 'Price', 'Qty']);
  var slotNo = 1;
  (b.entriesSnapshot||[]).forEach(function(e){
    var start = slotNo; slotNo += e.qty; var end = slotNo - 1;
    var slotLabel = e.qty === 1 ? padSlot(start) : (padSlot(start)+' - '+padSlot(end));
    rows.push([slotLabel, e.nonHit ? 'Non-hit' : 'Hit', e.label, e.sku||'', e.condition||'', e.price||'', e.qty]);
  });
  if(b.lastOneSnapshot){
    rows.push(['Last One', 'Last One', b.lastOneSnapshot.name, '', '', b.lastOneSnapshot.price||'', 1]);
  }
  rows.push([]);

  rows.push(['Live Date', 'Note', 'Spots Sold', 'Sale Value', 'Fee %', 'Fee Amount', 'Payout', 'Payment Status']);
  var pricePerSpot = b.stats.pricePerSpot;
  var feePct = (b.sellerFeePct != null) ? b.sellerFeePct : 5;
  (b.liveSessions||[]).forEach(function(s){
    var soldQty = (s.sales||[]).reduce(function(sum,r){ return sum + (r.sold ? (r.qty||0) : 0); }, 0);
    var saleValue = soldQty * pricePerSpot;
    var feeAmount = saleValue * (feePct/100);
    var payout = saleValue - feeAmount;
    rows.push([s.date, s.note||'', soldQty, saleValue, feePct, feeAmount, payout, s.paymentStatus||'PENDING']);
  });
  return rows;
}

function exportBoardCSV(){
  var b = myBoards[currentBoardIdx];
  if(!b) return;
  var safeName = (b.boardName||'board').replace(/[^a-z0-9]+/gi,'-');
  downloadCSV(safeName + '.csv', boardToCSVBlock(b));
}

var selectedBoardIdx = {};

function onBoardCheckChange(idx, checked){
  if(checked) selectedBoardIdx[idx] = true;
  else delete selectedBoardIdx[idx];
  updateSelectedCountLabel();
  updateSelectAllCheckboxState();
}

function toggleSelectAllBoards(checked){
  document.querySelectorAll('.board-select-chk').forEach(function(chk){
    chk.checked = checked;
    var idx = +chk.dataset.idx;
    if(checked) selectedBoardIdx[idx] = true;
    else delete selectedBoardIdx[idx];
  });
  updateSelectedCountLabel();
}

function updateSelectAllCheckboxState(){
  var selectAll = document.getElementById('selectAllBoards');
  if(!selectAll) return;
  var chks = document.querySelectorAll('.board-select-chk');
  if(!chks.length){ selectAll.checked = false; return; }
  selectAll.checked = Array.prototype.every.call(chks, function(c){ return c.checked; });
}

function updateSelectedCountLabel(){
  var n = Object.keys(selectedBoardIdx).length;
  var lbl = document.getElementById('selectedCountLabel');
  if(lbl) lbl.textContent = n ? ('(' + n + ' selected)') : '';
}

function exportBoardsMulti(list, filenamePrefix){
  var combined = [];
  list.forEach(function(b, i){
    if(i > 0){
      combined.push([]);
      combined.push(['=====================================']);
      combined.push([]);
    }
    combined = combined.concat(boardToCSVBlock(b));
  });
  downloadCSV(filenamePrefix + '.csv', combined);
}

function exportSelectedBoards(){
  var idxs = Object.keys(selectedBoardIdx).map(Number);
  if(!idxs.length){ alert('Select at least one board first / กรุณาเลือกบอร์ดก่อนอย่างน้อย 1 บอร์ด'); return; }
  var list = idxs.map(function(i){ return myBoards[i]; });
  exportBoardsMulti(list, idxs.length === myBoards.length ? 'my-boards' : 'selected-boards');
}

function tryEnter(){
  var email = document.getElementById('emailInput').value.trim().toLowerCase();
  var errEl = document.getElementById('gateError');
  errEl.style.display = 'none';

  if(!apiConfigured()){
    errEl.textContent = 'API_URL ยังไม่ได้ตั้งค่าในไฟล์นี้ / API_URL is not set in this file yet';
    errEl.style.display = 'block';
    return;
  }
  if(!email){
    errEl.textContent = 'กรุณากรอกอีเมล / Please enter your email';
    errEl.style.display = 'block';
    return;
  }

  fetch(API_URL + '?action=getBySeller&email=' + encodeURIComponent(email))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.ok){
        errEl.textContent = 'Error: ' + res.error;
        errEl.style.display = 'block';
        return;
      }
      myBoards = res.boards || [];
      if(!myBoards.length){
        errEl.textContent = 'ไม่พบบอร์ดสำหรับอีเมลนี้ / No boards found for this email';
        errEl.style.display = 'block';
        return;
      }
      selectedBoardIdx = {};
      document.getElementById('gateView').style.display = 'none';
      document.getElementById('boardsView').style.display = 'block';
      showBoardsList();
    })
    .catch(function(err){
      errEl.textContent = 'Request failed: ' + err.message;
      errEl.style.display = 'block';
    });
}

function backToGate(){
  document.getElementById('boardsView').style.display = 'none';
  document.getElementById('gateView').style.display = 'block';
}

// ---- All Boards list (seller's own boards only — no search/grouping needed) ----
function renderBoardsListSeller(){
  var wrap = document.getElementById('sellerBoardsListWrap');
  wrap.innerHTML = '';
  myBoards.forEach(function(b, i){
    var row = document.createElement('div');
    row.className = 'board-row';
    row.onclick = function(e){
      if(e.target.classList.contains('board-select-chk')) return;
      viewBoard(i);
    };
    row.innerHTML =
      '<input type="checkbox" class="board-select-chk" data-idx="'+i+'" '+(selectedBoardIdx[i] ? 'checked' : '')+'>'+
      '<div class="board-row-main">'+
        '<div class="board-row-title">'+b.boardName+' <span class="status-badge '+(b.status||'PREPARE').toLowerCase()+'">'+(b.status||'PREPARE')+'</span></div>'+
        '<div class="board-row-sub">'+fmtPrice(b.stats.pricePerSpot)+' / spot</div>'+
      '</div>'+
      '<div class="board-row-stats">'+
        '<div>Spots<b>'+b.stats.totalSlots+'</b></div>'+
        '<div>Max Money<b>'+fmt(b.stats.maxMoney)+'</b></div>'+
        '<div>Hit/Non-hit<b>'+b.stats.hitCount+' / '+b.stats.nonHitCount+'</b></div>'+
      '</div>';
    var chk = row.querySelector('.board-select-chk');
    chk.onchange = function(){ onBoardCheckChange(i, chk.checked); };
    wrap.appendChild(row);
  });
  updateSelectAllCheckboxState();
}

function showBoardsList(){
  document.getElementById('boardDetailSubView').style.display = 'none';
  document.getElementById('boardsListSubView').style.display = 'block';
  renderBoardsListSeller();
}

function viewBoard(i){
  currentBoardIdx = i;
  document.getElementById('boardsListSubView').style.display = 'none';
  document.getElementById('boardDetailSubView').style.display = 'block';
  renderBoard();
}

function renderBoard(){
  var b = myBoards[currentBoardIdx];
  var wrap = document.getElementById('boardDetail');

  var html = '';
  html += '<div style="margin-bottom:6px;"><span style="color:var(--sub); font-size:13px;">Seller: <b style="color:var(--dark);">'+b.sellerEmail+'</b></span></div>';
  html += '<h1 style="font-size:24px; margin:0 0 14px;">'+b.boardName+' <span class="status-badge '+(b.status||'PREPARE').toLowerCase()+'">'+(b.status||'PREPARE')+'</span></h1>';

  html += '<div class="top-row">'+
    '<div class="top-box"><span data-th>ราคาต่อช่อง</span><span data-en>Price / spot</span><b>'+fmt(b.stats.pricePerSpot)+'</b></div>'+
    '<div class="top-box"><span data-th>จำนวนช่อง</span><span data-en>Total spots</span><b>'+b.stats.totalSlots+'</b></div>'+
  '</div>';

  html += '<div class="summary"><div class="summary-top"><span class="summary-label"><span data-th>มูลค่าบอร์ดรวม</span><span data-en>Total board value</span></span><span class="summary-value">'+fmt(b.stats.maxMoney)+'</span></div>'+
    '<div class="summary-counts">'+
      '<div class="count-box"><div class="label"><span data-th>จำนวนฮิต</span><span data-en>Hit count</span></div><div class="value">'+b.stats.hitCount+'</div></div>'+
      '<div class="count-box"><div class="label"><span data-th>จำนวนไม่ฮิต</span><span data-en>Non-hit count</span></div><div class="value">'+b.stats.nonHitCount+'</div></div>'+
    '</div></div>';

  if(b.showPricingToSeller !== false){
    html += '<div class="card"><h2><span data-th>ราคาและการคำนวณ</span><span data-en>Pricing & Calculation</span></h2>'+
      '<div class="stat-grid">'+
        '<div class="stat-card accent"><div class="l"><span data-th>รายได้สูงสุด</span><span data-en>Max Money</span></div><div class="v">'+fmt(b.stats.maxMoney)+'</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>ต้นทุนรวม</span><span data-en>Total Cost</span></div><div class="v">'+fmt(b.stats.totalCost)+'</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>ต้นทุน %</span><span data-en>Cost %</span></div><div class="v">'+b.stats.costPct.toFixed(2)+'%</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>กำไรถ้าขายหมด</span><span data-en>Profit if sold out</span></div><div class="v">'+fmt(b.stats.profit)+'</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>กำไร %</span><span data-en>Profit %</span></div><div class="v">'+b.stats.profitPct.toFixed(2)+'%</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>มูลค่าเฉลี่ยต่อจุ่ม</span><span data-en>Avg prize / pull</span></div><div class="v">'+fmt(b.stats.avgPrize)+'</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>ราคาที่ไม่ขาดทุน</span><span data-en>Break-even price</span></div><div class="v">'+fmt(b.stats.breakEven)+'</div></div>'+
        '<div class="stat-card"><div class="l"><span data-th>จำนวนจุ่มทั้งหมด</span><span data-en>Total pulls</span></div><div class="v">'+b.stats.totalSlots+'</div></div>'+
      '</div></div>';
  }

  html += '<div class="item-list">';
  var slotNo = 1;
  (b.entriesSnapshot||[]).forEach(function(e){
    var startSlot = slotNo; slotNo += e.qty; var endSlot = slotNo - 1;
    var rangeLabel = e.qty === 1 ? ('S-'+String(startSlot).padStart(3,'0')) : ('S-'+String(startSlot).padStart(3,'0')+' – S-'+String(endSlot).padStart(3,'0'));
    html += '<div class="item"><div class="item-top">'+
      (e.img ? '<img src="'+e.img+'" onerror="this.style.display=\'none\';">' : '')+
      '<span class="item-badge">'+rangeLabel+'</span>'+
      '<div class="item-info"><div class="item-name">'+e.label+'</div><div class="item-sub">'+(e.condition||'')+(e.nonHit ? ' · non-hit' : '')+'</div></div>'+
      '<div class="item-price">'+fmtPrice(e.price)+' × '+e.qty+'</div>'+
    '</div></div>';
  });
  if(b.lastOneSnapshot){
    html += '<div class="item"><div class="item-top"><span class="item-badge">Last One</span><div class="item-info"><div class="item-name">'+b.lastOneSnapshot.name+'</div></div><div class="item-price">'+fmt(b.lastOneSnapshot.price)+'</div></div></div>';
  }
  html += '</div>';

  var sessions = b.liveSessions || [];
  var pricePerSpot = b.stats.pricePerSpot;
  var feePct = (b.sellerFeePct != null) ? b.sellerFeePct : 5;

  var entryMap = {}, slotMap = {}, sNo = 1;
  (b.entriesSnapshot||[]).forEach(function(e){
    var key = e.uid || e.label; // back-compat for boards saved before uid tracking existed
    entryMap[key] = e;
    var start = sNo; sNo += e.qty; var end = sNo - 1;
    slotMap[key] = {start:start, end:end};
  });

  var totalSpotsSold = 0, totalSaleValue = 0, totalFee = 0, totalPayout = 0;

  html += '<div class="card"><h2><span data-th>ประวัติการไลฟ์ & การจ่ายเงิน</span><span data-en>Live History & Payment</span> ('+sessions.length+')</h2>';
  sessions.forEach(function(s){
      var soldItems = (s.sales||[]).filter(function(r){ return r.sold; });
      var soldQty = soldItems.reduce(function(sum,r){ return sum + (r.qty||0); }, 0);
      var saleValue = soldQty * pricePerSpot;
      var feeAmount = saleValue * (feePct/100);
      var payout = saleValue - feeAmount;
      var status = s.paymentStatus || 'PENDING';

      if(status !== 'CANCEL'){
        totalSpotsSold += soldQty;
        totalSaleValue += saleValue;
        totalFee += feeAmount;
        totalPayout += payout;
      }

      html += '<div class="live-session"><div class="live-session-top-row">'+
        '<div class="live-session-date">'+formatDateDMY(s.date)+(s.note ? ' · '+s.note : '')+'</div>'+
        '<span class="status-badge '+status.toLowerCase()+'">'+status+'</span>'+
      '</div>';
      if(!soldItems.length){
        html += '<div class="live-session-meta"><span data-th>ยังไม่ได้บันทึกยอดขาย</span><span data-en>No sales recorded</span></div>';
      } else {
        html += '<div class="item-list" style="margin-top:10px;">';
        soldItems.forEach(function(r){
          var entry = entryMap[r.label] || {};
          var badgeNums = r.slots ? r.slots : (slotMap[r.label] ? [slotMap[r.label].start] : []);
          var badgesHtml = badgeNums.map(function(n){ return '<span class="item-badge">S-'+String(n).padStart(3,'0')+'</span>'; }).join('');
          html += '<div class="item"><div class="item-top">'+
            (entry.img ? '<img src="'+entry.img+'" onerror="this.style.display=\'none\';">' : '')+
            '<div class="item-badges">'+badgesHtml+'</div>'+
            '<div class="item-info"><div class="item-name">'+r.label+'</div><div class="item-sub">'+(entry.condition||'')+'</div></div>'+
            '<div class="item-price">'+fmtPrice(entry.price)+' × '+r.qty+'</div>'+
          '</div></div>';
        });
        html += '</div>';
        html += '<div class="live-pay-grid">'+
          '<div class="lp-box"><div class="lp-label"><span data-th>ยอดขาย</span><span data-en>Sale value</span></div><div class="lp-value">'+fmt(saleValue)+'</div></div>'+
          '<div class="lp-box"><div class="lp-label"><span data-th>หัก '+feePct+'%</span><span data-en>Fee '+feePct+'%</span></div><div class="lp-value">-'+fmt(feeAmount)+'</div></div>'+
          '<div class="lp-box accent"><div class="lp-label"><span data-th>ได้รับ</span><span data-en>You receive</span></div><div class="lp-value">'+fmt(payout)+'</div></div>'+
        '</div>';
      }
      html += '</div>';
    });
  html += '</div>';

  html += '<div class="card"><h2><span data-th>สรุปยอดจ่ายรวม</span><span data-en>Payment Summary</span></h2>'+
    '<div class="stat-grid">'+
      '<div class="stat-card"><div class="l"><span data-th>ช่องขายไปแล้วรวม</span><span data-en>Total spots sold</span></div><div class="v">'+totalSpotsSold+'</div></div>'+
      '<div class="stat-card"><div class="l"><span data-th>ยอดขายรวม</span><span data-en>Total sale value</span></div><div class="v">'+fmt(totalSaleValue)+'</div></div>'+
      '<div class="stat-card"><div class="l"><span data-th>หักรวม</span><span data-en>Total fee deducted</span></div><div class="v">'+fmt(totalFee)+'</div></div>'+
      '<div class="stat-card accent"><div class="l"><span data-th>ยอดที่จะได้รับรวม</span><span data-en>Total you receive</span></div><div class="v">'+fmt(totalPayout)+'</div></div>'+
    '</div></div>';

  wrap.innerHTML = html;
}

function setLang(lang){
  document.documentElement.setAttribute('data-lang', lang);
  document.querySelectorAll('.toggle-pill .opt.th, .toggle-pill .opt.en').forEach(function(o){ o.classList.remove('active'); });
  document.querySelectorAll('.toggle-pill .opt.'+lang).forEach(function(o){ o.classList.add('active'); });
}
</script>
</body>
</html>
